name: tmp-gemastik19-fdb
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Optimized ECM check
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gmp-ecm >/dev/null
          N=''
          echo "$N" | timeout 210 ecm -c 120 100000 10000000 > /tmp/ecm.out 2>&1
          rc=$?
          cat /tmp/ecm.out
          echo "ECM_EXIT=$rc"
          exit 0
