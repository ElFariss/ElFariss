name: tmp-gemastik19-fdb
on:
  pull_request:
    branches: [main]

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: RSA structural attack sweep
        shell: bash
        run: |
          set -u
          git clone --depth 1 https://github.com/RsaCtfTool/RsaCtfTool.git /tmp/RsaCtfTool
          python3 -m venv /tmp/rsaenv
          source /tmp/rsaenv/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q -e /tmp/RsaCtfTool
          N=''
          set +e
          PYTHONUNBUFFERED=1 timeout 210 RsaCtfTool -n "$N" -e 65537 --private --attack all --timeout 5 --verbosity INFO 2>&1 | tee /tmp/rsactf.log
          rc=${PIPESTATUS[0]}
          echo "RSACTF_EXIT=$rc"
          exit 0
